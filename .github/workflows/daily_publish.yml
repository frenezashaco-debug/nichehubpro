name: Daily Article Publisher

on:
  # Automated publication runs only after the full publisher_v2 quality gate.
  schedule:
    - cron: "15 08 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: article-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements*.txt') }}-v1
          restore-keys: pip-

      - name: Install dependencies
        run: pip install anthropic httpx json-repair Pillow requests urllib3

      - name: Create config.py from secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          MAKE_PINTEREST_WEBHOOK: ${{ secrets.MAKE_PINTEREST_WEBHOOK }}
        run: |
          printf 'ANTHROPIC_API_KEY = "%s"\n' "$ANTHROPIC_API_KEY" > config.py
          printf 'HF_API_KEY = "%s"\n' "$HF_API_KEY" >> config.py
          printf 'PINTEREST_ACCESS_TOKEN = "%s"\n' "$PINTEREST_ACCESS_TOKEN" >> config.py
          printf 'MAKE_PINTEREST_WEBHOOK = "%s"\n' "$MAKE_PINTEREST_WEBHOOK" >> config.py
          printf 'OPENAI_API_KEY = ""\n' >> config.py
          python3 -c "import config; print('HF key OK:', bool(config.HF_API_KEY)); print('Anthropic key OK:', bool(config.ANTHROPIC_API_KEY))"

      - name: Show current publish status
        run: python batch_24weeks.py --status

      - name: Generate and quality-check next article
        env:
          NICHEHUB_AUTO_PUBLISH: "1"
        run: python batch_24weeks.py

      - name: Commit and push
        id: publication
        run: |
          git config user.name "NicheHubPro Bot"
          git config user.email "bot@nichehubpro.com"
          git add articles/ images/ articles.js api/articles.json sitemap.xml index.html
          if git diff --staged --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Auto-publish: daily article $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Deploy publication to GitHub Pages
        if: steps.publication.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/wait_pages_build.py

      - name: Ping search engines
        if: steps.publication.outputs.published == 'true'
        continue-on-error: true
        run: python ping_indexing.py --new-only

      - name: Purge Cloudflare cache
        if: steps.publication.outputs.published == 'true'
        continue-on-error: true
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "CF secrets not set — skipping cache purge."
            exit 0
          fi
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print('Cache purged OK' if r.get('success') else f'Purge failed: {r}')"

      - name: Push Pinterest pins
        if: steps.publication.outputs.published == 'true'
        run: python auto_pins.py
